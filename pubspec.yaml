name: apple_music_flutter
description: Apple Music iOS-style clone for Android
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.36
  on_audio_query: ^2.9.0
  palette_generator: ^0.3.3+3
  provider: ^6.1.1
  glassmorphism: ^3.0.0
  cached_network_image: ^3.3.0
  marquee: ^2.2.3
  rxdart: ^0.27.7
  permission_handler: ^11.0.1
  audio_session: ^0.1.18
  lottie: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
