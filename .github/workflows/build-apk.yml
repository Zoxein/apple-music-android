name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Patch legacy plugins for AGP 8
        run: |
          for f in $(find /home/runner/.pub-cache -name "build.gradle" -path "*/on_audio_query_android*/*"); do
            echo "Patching $f"
            sed -i '/android {/a \    namespace "com.lucasjosino.on_audio_query"' "$f"
          done
          for m in $(find /home/runner/.pub-cache -name "AndroidManifest.xml" -path "*/on_audio_query_android*/*"); do
            echo "Patching manifest $m"
            sed -i 's/package="com.lucasjosino.on_audio_query"//g' "$m"
          done

      - name: Build Universal APK
        run: flutter build apk --release

      - name: Build APK arm64
        run: flutter build apk --release --target-platform android-arm64

      - name: List APK output
        run: ls -la build/app/outputs/flutter-apk/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Apple-Music-APKs
          path: build/app/outputs/flutter-apk/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "🎵 Apple Music Clone v1.0.${{ github.run_number }}"
          body: |
            ## 🎵 Apple Music Clone for Android

            ### 📲 دانلود فایل‌های APK:
            | فایل | دستگاه هدف |
            |------|------------|
            | **app-arm64-v8a-release.apk** | اکثر گوشی‌های مدرن اندروید (پیشنهادی) |
            | **app-release.apk** | نسخه یونیورسال (سازگار با همه گوشی‌ها) |

            ### ✨ قابلیت‌ها:
            - 🎨 رابط کاربری مشابه Apple Music در iOS با افکت‌های بلور شیشه‌ای
            - 💿 انیمیشن چرخشی کاور آلبوم هنگام پخش موسیقی
            - 🎶 دسترسی به تمام آهنگ‌های محلی ذخیره شده روی گوشی
            - 🔍 جستجو در بین آهنگ‌ها، خواننده‌ها و آلبوم‌ها
            - 🔀 حالت‌های Shuffle و Repeat
            - 📱 مینی‌پلیر شیشه‌ای (Frosted Glass) در پایین صفحه
            - 🌙 تم تیره اختصاصی iOS

            ### 📋 نحوه نصب:
            1. فایل APK را دانلود کنید.
            2. در تنظیمات گوشی اجازه نصب از منابع ناشناس (Unknown Sources) را بدهید.
            3. فایل را باز کرده و نصب کنید.
          files: build/app/outputs/flutter-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
