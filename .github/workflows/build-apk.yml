name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Patch on_audio_query for AGP8 + Java17
        run: python3 patch_plugin.py

      - name: Build Universal APK
        run: flutter build apk --release

      - name: Build APK arm64
        run: flutter build apk --release --target-platform android-arm64

      - name: List APK output
        run: ls -la build/app/outputs/flutter-apk/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Apple-Music-APKs
          path: build/app/outputs/flutter-apk/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Apple Music Clone v1.0.${{ github.run_number }}"
          body: |
            ## Apple Music Clone for Android

            Download APK files below - install and enjoy!

            - app-arm64-v8a-release.apk -> Recommended for most modern phones
            - app-release.apk -> Universal (all devices)

            Install: enable Unknown Sources in Android settings, then open the APK.
          files: build/app/outputs/flutter-apk/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}