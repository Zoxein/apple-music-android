name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build APK arm64
        run: flutter build apk --release --target-platform android-arm64

      - name: Build Universal APK
        run: flutter build apk --release

      - name: List APK output
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Apple-Music-APKs
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "🎵 Apple Music Clone v1.0.${{ github.run_number }}"
          body: |
            ## 🎵 Apple Music Clone for Android

            ### 📲 Download APK:
            | File | Device |
            |------|--------|
            | **app-arm64-v8a-release.apk** | Most modern Android phones ✅ (Recommended) |
            | **app-release.apk** | Universal - works on all Android devices |

            ### ✨ Features:
            - 🎨 Dynamic blurred background matching album art colors
            - 💿 Rotating album art animation when playing
            - 🎵 Full local music library (reads from your device)
            - 🔍 Search songs, artists, albums
            - 🔀 Shuffle & repeat modes
            - ❤️ Like songs
            - 📱 Mini player with frosted glass effect
            - 🌙 Dark theme like iOS Apple Music

            ### 📋 Install:
            1. Download the APK
            2. Enable "Install from unknown sources" in your Android settings
            3. Open the APK and install
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
